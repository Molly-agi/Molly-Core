name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'COPILOT_SESSION_STATE.json'
      - 'COPILOT_SESSION_STATE.md'
      - '.github/copilot-instructions.md'
      - '*.md'
      - 'docs/**'
      - '.codespace-heartbeat'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting (full project)
        run: npm run lint

      - name: Lint UI components (blocking)
        # 2 cosmetic warnings: layout.tsx custom-font, MemoryViewer <img> tag
        # +1 ChatHistory <img> tag
        run: npx eslint src/components/ src/app/page.tsx src/app/layout.tsx src/app/error.tsx --max-warnings 3

      - name: Run tests
        run: npx jest --ci --forceExit --maxWorkers=2
        timeout-minutes: 5

      - name: Build project (includes type checking)
        run: npm run build
        env:
          NODE_ENV: production
          NODE_OPTIONS: '--max-old-space-size=4096'
