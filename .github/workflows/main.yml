name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting (full project)
        run: npm run lint

      - name: Lint UI components (blocking)
        # 2 cosmetic warnings: layout.tsx custom-font placement, MemoryViewer <img> tag
        run: npx eslint src/components/ src/app/page.tsx src/app/layout.tsx src/app/error.tsx --max-warnings 2

      - name: Run type checking
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --ci --coverage --maxWorkers=2

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production
