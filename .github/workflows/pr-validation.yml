name: PR Validation - Merge Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]

jobs:
  validation-gate:
    name: PR Validation Gate
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Validate PR title follows conventional commits
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if echo "$PR_TITLE" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?: .+"; then
            echo "✓ PR title follows conventional commits format"
          else
            echo "❌ PR title must follow conventional commits format"
            echo "Examples: 'feat: add new feature', 'fix: resolve bug', 'docs: update readme'"
            exit 1
          fi
      
      - name: Check for unresolved merge conflicts
        run: |
          if git diff --check; then
            echo "✓ No merge conflict markers found"
          else
            echo "❌ Merge conflict markers detected"
            exit 1
          fi
      
      - name: Run all tests
        run: npm test -- --ci --coverage --maxWorkers=2
        env:
          CI: true
      
      - name: Verify build succeeds
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Check for breaking changes
        run: |
          echo "Checking for breaking changes in public APIs..."
          # Check if any exported functions/interfaces were removed or modified
          if git diff origin/${{ github.base_ref }}...HEAD -- "src/**/*.ts" | grep -E "^-export (function|interface|class|const|type)"; then
            echo "⚠️  WARNING: Potential breaking changes detected in exports"
            echo "Please ensure backward compatibility or mark as breaking change"
          else
            echo "✓ No obvious breaking changes detected"
          fi
      
      - name: Ensure PR has description
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          if [ -z "$PR_BODY" ] || [ ${#PR_BODY} -lt 20 ]; then
            echo "❌ PR must have a meaningful description (at least 20 characters)"
            exit 1
          else
            echo "✓ PR has description"
          fi

  security-gate:
    name: Security Validation Gate
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run security audit
        run: |
          if npm audit --audit-level=high; then
            echo "✓ No high-severity vulnerabilities found"
          else
            echo "❌ High-severity vulnerabilities detected"
            echo "Please fix vulnerabilities before merging"
            exit 1
          fi
      
      - name: Check for sensitive file changes
        run: |
          echo "Checking for sensitive file modifications..."
          SENSITIVE_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E "\.env|\.key|\.pem|\.crt|secret|credential" || true)
          if [ ! -z "$SENSITIVE_FILES" ]; then
            echo "⚠️  WARNING: Sensitive files modified:"
            echo "$SENSITIVE_FILES"
            echo "Ensure no secrets are committed"
          else
            echo "✓ No sensitive file modifications detected"
          fi

  status-summary:
    name: Status Check Summary
    runs-on: ubuntu-latest
    needs: [validation-gate, security-gate]
    if: always()
    
    steps:
      - name: Check all validations passed
        run: |
          if [[ "${{ needs.validation-gate.result }}" == "success" ]] && [[ "${{ needs.security-gate.result }}" == "success" ]]; then
            echo "✅ All validation gates passed - PR is ready to merge"
          else
            echo "❌ One or more validation gates failed"
            echo "Validation Gate: ${{ needs.validation-gate.result }}"
            echo "Security Gate: ${{ needs.security-gate.result }}"
            exit 1
          fi
