name: Deploy - Production Deployment with Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - production
          - staging
      rollback_version:
        description: 'Rollback to specific version (leave empty for new deployment)'
        required: false
        type: string

jobs:
  pre-deployment-checks:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_version || github.ref }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run all tests
        run: npm test -- --ci --maxWorkers=2
        env:
          CI: true
      
      - name: Build for production
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Archive production build
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            .next/
            out/
            package.json
            package-lock.json
          retention-days: 30

  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_version || github.ref }}
      
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-build
      
      - name: Create deployment tag
        if: github.event.inputs.rollback_version == ''
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          DEPLOY_TAG="deploy-${{ github.event.inputs.environment }}-${TIMESTAMP}"
          echo "DEPLOY_TAG=${DEPLOY_TAG}" >> $GITHUB_ENV
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${DEPLOY_TAG}" -m "Deployment to ${{ github.event.inputs.environment }} at ${TIMESTAMP}"
          git push origin "${DEPLOY_TAG}"
      
      - name: Record rollback tag
        if: github.event.inputs.rollback_version != ''
        run: |
          echo "DEPLOY_TAG=${{ github.event.inputs.rollback_version }}" >> $GITHUB_ENV
          echo "Deploying rollback version: ${{ github.event.inputs.rollback_version }}"
      
      - name: Deploy to Firebase (Production)
        if: github.event.inputs.environment == 'production'
        run: |
          echo "Deploying to Firebase Hosting..."
          # npm install -g firebase-tools
          # firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
          echo "✓ Deployment complete - Tag: ${DEPLOY_TAG}"
      
      - name: Deploy to Staging
        if: github.event.inputs.environment == 'staging'
        run: |
          echo "Deploying to staging environment..."
          echo "✓ Staging deployment complete"
      
      - name: Create deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${DEPLOY_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.rollback_version }}" != "" ]; then
            echo "- **Type:** Rollback" >> $GITHUB_STEP_SUMMARY
            echo "- **Rollback from:** Previous version" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Type:** New deployment" >> $GITHUB_STEP_SUMMARY
          fi

  post-deployment-verification:
    name: Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30
      
      - name: Health check
        run: |
          echo "Running post-deployment health checks..."
          # Add your health check endpoints here
          # curl -f https://your-app-url.com/health || exit 1
          echo "✓ Health checks passed"
      
      - name: Smoke tests
        run: |
          echo "Running smoke tests..."
          # Add your critical path smoke tests here
          echo "✓ Smoke tests passed"
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment successful and verified!"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "All systems operational"
      
      - name: Alert on failure
        if: failure()
        run: |
          echo "❌ Deployment verification failed!"
          echo "Consider rolling back to previous version"
          exit 1

  rollback-on-failure:
    name: Auto-Rollback on Failure
    runs-on: ubuntu-latest
    needs: post-deployment-verification
    if: failure() && github.event.inputs.rollback_version == ''
    
    steps:
      - name: Get previous deployment tag
        id: get_previous_tag
        run: |
          # Get the second most recent deployment tag
          PREVIOUS_TAG=$(git tag -l "deploy-${{ github.event.inputs.environment }}-*" | sort -r | sed -n '2p')
          echo "PREVIOUS_TAG=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT
          echo "Will rollback to: ${PREVIOUS_TAG}"
      
      - name: Trigger rollback deployment
        if: steps.get_previous_tag.outputs.PREVIOUS_TAG != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                environment: '${{ github.event.inputs.environment }}',
                rollback_version: '${{ steps.get_previous_tag.outputs.PREVIOUS_TAG }}'
              }
            });
      
      - name: Notify rollback initiated
        run: |
          echo "🔄 Automatic rollback initiated"
          echo "Rolling back to: ${{ steps.get_previous_tag.outputs.PREVIOUS_TAG }}"
