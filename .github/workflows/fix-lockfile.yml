name: Auto-fix package-lock.json

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - copilot/restore-context-functionality

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/restore-context-functionality
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Regenerate package-lock.json
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      
      - name: Commit updated lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet || git commit -m "fix: regenerate package-lock.json to sync with package.json"
          git push