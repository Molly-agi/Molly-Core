<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱 Molly Keep-Alive</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #8b949e; margin-bottom: 24px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 500;
      margin-bottom: 24px;
    }
    .status.active { background: rgba(63, 185, 80, 0.15); color: var(--green); }
    .status.warning { background: rgba(210, 153, 34, 0.15); color: var(--yellow); }
    .status.error { background: rgba(248, 81, 73, 0.15); color: var(--red); }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat {
      background: var(--bg);
      padding: 16px;
      border-radius: 8px;
    }
    .stat-value { font-size: 24px; font-weight: bold; }
    .stat-label { font-size: 12px; color: #8b949e; margin-top: 4px; }
    .log {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      max-height: 200px;
      overflow-y: auto;
      text-align: left;
      font-family: monospace;
      font-size: 12px;
    }
    .log-entry { margin-bottom: 4px; }
    .log-entry .time { color: #8b949e; }
    .log-entry.success { color: var(--green); }
    .log-entry.error { color: var(--red); }
    .config {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    label { display: block; margin-bottom: 8px; font-size: 14px; }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      margin-bottom: 12px;
    }
    button {
      background: var(--green);
      color: #0d1117;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { opacity: 0.9; }
    .info {
      margin-top: 24px;
      font-size: 12px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌱 Molly Keep-Alive</h1>
    <p class="subtitle">Prevents Codespace idle timeout</p>

    <div id="status" class="status active">
      <span class="dot"></span>
      <span id="status-text">Initializing...</span>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="ping-count">0</div>
        <div class="stat-label">Pings Sent</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="uptime">0m</div>
        <div class="stat-label">Session Uptime</div>
      </div>
    </div>

    <div class="log" id="log"></div>

    <div class="config">
      <label>Codespace URL (e.g., https://xxx.github.dev)</label>
      <input type="text" id="url" placeholder="Enter your Codespace URL">
      <button onclick="startKeepAlive()">Start Keep-Alive</button>
    </div>

    <p class="info">
      Keep this tab open in the background. Pings every 2 minutes.<br>
      Works even when your main Codespace tab is closed.
    </p>
  </div>

  <script>
    let pingCount = 0;
    let startTime = Date.now();
    let intervalId = null;
    let baseUrl = '';

    const statusEl = document.getElementById('status');
    const statusTextEl = document.getElementById('status-text');
    const pingCountEl = document.getElementById('ping-count');
    const uptimeEl = document.getElementById('uptime');
    const logEl = document.getElementById('log');
    const urlInput = document.getElementById('url');

    // Try to detect Codespace URL from localStorage
    const savedUrl = localStorage.getItem('molly-keepalive-url');
    if (savedUrl) {
      urlInput.value = savedUrl;
    }

    function log(message, type = '') {
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.innerHTML = `<span class="time">${time}</span> ${message}`;
      logEl.insertBefore(entry, logEl.firstChild);

      // Keep only last 50 entries
      while (logEl.children.length > 50) {
        logEl.removeChild(logEl.lastChild);
      }
    }

    function updateUptime() {
      const mins = Math.floor((Date.now() - startTime) / 60000);
      const hours = Math.floor(mins / 60);
      if (hours > 0) {
        uptimeEl.textContent = `${hours}h ${mins % 60}m`;
      } else {
        uptimeEl.textContent = `${mins}m`;
      }
    }

    function setStatus(state, text) {
      statusEl.className = `status ${state}`;
      statusTextEl.textContent = text;
    }

    async function ping() {
      if (!baseUrl) return;

      try {
        // Try to fetch the health endpoint
        const response = await fetch(`${baseUrl}/api/health`, {
          method: 'GET',
          mode: 'cors',
          cache: 'no-store',
        });

        if (response.ok) {
          pingCount++;
          pingCountEl.textContent = pingCount;
          setStatus('active', 'Connected');
          log('✓ Ping successful', 'success');
        } else {
          setStatus('warning', `HTTP ${response.status}`);
          log(`⚠ HTTP ${response.status}`, 'error');
        }
      } catch (err) {
        // CORS errors are expected but the request still wakes the Codespace
        pingCount++;
        pingCountEl.textContent = pingCount;
        setStatus('active', 'Pinging (CORS expected)');
        log('✓ Ping sent (CORS is normal)', 'success');
      }

      updateUptime();
    }

    function startKeepAlive() {
      const url = urlInput.value.trim();
      if (!url) {
        alert('Please enter your Codespace URL');
        return;
      }

      // Normalize URL
      baseUrl = url.replace(/\/$/, '');
      if (!baseUrl.startsWith('http')) {
        baseUrl = 'https://' + baseUrl;
      }

      // Convert github.dev to the port-forwarded URL if needed
      if (baseUrl.includes('.github.dev') && !baseUrl.includes('-9002.')) {
        // Insert port number: xxx.github.dev -> xxx-9002.app.github.dev
        baseUrl = baseUrl.replace('.github.dev', '-9002.app.github.dev');
      }

      localStorage.setItem('molly-keepalive-url', urlInput.value);

      // Clear any existing interval
      if (intervalId) clearInterval(intervalId);

      startTime = Date.now();
      pingCount = 0;

      log(`🚀 Starting keep-alive for ${baseUrl}`);
      setStatus('active', 'Starting...');

      // Initial ping
      ping();

      // Ping every 2 minutes
      intervalId = setInterval(ping, 120000);

      log('⏰ Pinging every 2 minutes');
    }

    // Update uptime display every minute
    setInterval(updateUptime, 60000);

    // Auto-start if URL was saved
    if (savedUrl) {
      setTimeout(() => {
        startKeepAlive();
      }, 1000);
    } else {
      setStatus('warning', 'Enter Codespace URL');
    }
  </script>
</body>
</html>
