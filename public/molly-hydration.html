<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Molly</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --molly: #da70d6;
      --success: #3fb950;
      --warning: #d29922;
      --error: #f85149;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px;
      text-align: center;
    }
    header h1 {
      font-size: 24px;
      font-weight: 600;
      background: linear-gradient(135deg, var(--molly), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header .status {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Main content */
    main {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }

    /* Status panel */
    .status-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .status-panel h2 {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .status-item:last-child { border-bottom: none; }
    .status-item .icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }
    .status-item .icon.pending { background: var(--border); }
    .status-item .icon.loading { background: var(--warning); animation: pulse 1s infinite; }
    .status-item .icon.success { background: var(--success); }
    .status-item .icon.error { background: var(--error); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .status-item .label { flex: 1; font-size: 14px; }
    .status-item .detail { font-size: 12px; color: var(--muted); }

    /* Action buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:active:not(:disabled) { opacity: 0.8; }
    button.secondary {
      background: var(--surface);
      border: 1px solid var(--border);
    }

    /* Chat section */
    .chat-section {
      display: none;
      flex-direction: column;
      height: calc(100dvh - 80px);
    }
    .chat-section.active { display: flex; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg.molly {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.system {
      align-self: center;
      font-size: 12px;
      color: var(--muted);
      background: none;
    }
    #input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 8px;
    }
    #input-area textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 120px;
    }
    #input-area button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      padding: 0;
      font-size: 18px;
    }

    /* Log panel */
    .log-panel {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 11px;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 16px;
    }
    .log-panel .log-entry {
      padding: 2px 0;
      color: var(--muted);
    }
    .log-panel .log-entry.success { color: var(--success); }
    .log-panel .log-entry.error { color: var(--error); }
    .log-panel .log-entry.info { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>Molly</h1>
    <div class="status" id="header-status">Initializing...</div>
  </header>

  <main id="setup-panel">
    <div class="status-panel">
      <h2>Hydration Status</h2>
      <div class="status-item" id="status-sw">
        <div class="icon pending">1</div>
        <span class="label">Service Worker</span>
        <span class="detail">Pending</span>
      </div>
      <div class="status-item" id="status-edge">
        <div class="icon pending">2</div>
        <span class="label">Edge Server (Termux)</span>
        <span class="detail">Checking...</span>
      </div>
      <div class="status-item" id="status-data">
        <div class="icon pending">3</div>
        <span class="label">Identity Data</span>
        <span class="detail">Pending</span>
      </div>
      <div class="status-item" id="status-notifications">
        <div class="icon pending">4</div>
        <span class="label">Notifications</span>
        <span class="detail">Pending</span>
      </div>
    </div>

    <div class="actions">
      <button id="btn-hydrate" disabled>Begin Hydration</button>
      <button id="btn-notifications" class="secondary" disabled>Enable Notifications</button>
      <button id="btn-chat" class="secondary" disabled>Talk to Molly</button>
    </div>

    <div class="log-panel" id="log-panel"></div>
  </main>

  <main class="chat-section" id="chat-panel">
    <div id="messages"></div>
    <div id="input-area">
      <textarea id="input" rows="1" placeholder="Talk to Molly..."></textarea>
      <button id="send" disabled>&#9654;</button>
    </div>
  </main>

  <script>
    // ========================================================================
    // STATE
    // ========================================================================
    const state = {
      swReady: false,
      edgeAvailable: false,
      edgeUrl: 'http://localhost:9100',
      dataLoaded: false,
      notificationsGranted: false,
      hydrated: false,
      chatHistory: [],
      systemPrompt: ''
    };

    // ========================================================================
    // LOGGING
    // ========================================================================
    function log(msg, type = '') {
      const panel = document.getElementById('log-panel');
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + type;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      panel.appendChild(entry);
      panel.scrollTop = panel.scrollHeight;
      console.log(`[molly-hydration] ${msg}`);
    }

    // ========================================================================
    // STATUS UPDATES
    // ========================================================================
    function setStatus(id, status, detail) {
      const item = document.getElementById(id);
      if (!item) return;
      const icon = item.querySelector('.icon');
      const detailEl = item.querySelector('.detail');
      icon.className = 'icon ' + status;
      if (detailEl) detailEl.textContent = detail;
    }

    function updateHeaderStatus(msg) {
      document.getElementById('header-status').textContent = msg;
    }

    // ========================================================================
    // SERVICE WORKER
    // ========================================================================
    async function initServiceWorker() {
      if (!('serviceWorker' in navigator)) {
        setStatus('status-sw', 'error', 'Not supported');
        log('Service Workers not supported', 'error');
        return false;
      }

      setStatus('status-sw', 'loading', 'Registering...');
      try {
        const reg = await navigator.serviceWorker.register('/molly-sw.js');
        log('Service Worker registered', 'success');

        // Wait for it to become active
        if (reg.installing) {
          await new Promise(resolve => {
            reg.installing.addEventListener('statechange', e => {
              if (e.target.state === 'activated') resolve();
            });
          });
        }

        state.swReady = true;
        setStatus('status-sw', 'success', 'Active');
        return true;
      } catch (err) {
        setStatus('status-sw', 'error', err.message);
        log('Service Worker failed: ' + err.message, 'error');
        return false;
      }
    }

    // ========================================================================
    // EDGE SERVER DETECTION
    // ========================================================================
    async function detectEdgeServer() {
      setStatus('status-edge', 'loading', 'Scanning...');

      // Try localhost:9100 first (standard Termux port)
      const ports = [9100, 9000, 8080];

      for (const port of ports) {
        try {
          const url = `http://localhost:${port}/api/health`;
          const response = await fetch(url, {
            method: 'GET',
            signal: AbortSignal.timeout(2000)
          });

          if (response.ok) {
            const health = await response.json();
            if (health.server === 'molly-edge') {
              state.edgeAvailable = true;
              state.edgeUrl = `http://localhost:${port}`;
              setStatus('status-edge', 'success', `Found on port ${port}`);
              log(`Edge server found: ${state.edgeUrl}`, 'success');
              return true;
            }
          }
        } catch {
          // Try next port
        }
      }

      setStatus('status-edge', 'pending', 'Not found (browser-only mode)');
      log('Edge server not found - using browser-only mode', 'info');
      return false;
    }

    // ========================================================================
    // DATA HYDRATION
    // ========================================================================
    async function hydrateData() {
      setStatus('status-data', 'loading', 'Fetching...');
      document.getElementById('btn-hydrate').disabled = true;

      try {
        // Try to fetch from cloud export endpoint
        let migrationData = null;

        // First try: Codespace API (if we have the URL)
        const cloudUrl = localStorage.getItem('molly-cloud-url');
        if (cloudUrl) {
          try {
            log('Fetching from cloud: ' + cloudUrl);
            const response = await fetch(`${cloudUrl}/api/migration/export`, {
              headers: { 'X-Molly-Internal': 'hydration' },
              signal: AbortSignal.timeout(10000)
            });
            if (response.ok) {
              migrationData = await response.json();
              log('Migration data fetched from cloud', 'success');
            }
          } catch (e) {
            log('Cloud fetch failed: ' + e.message, 'error');
          }
        }

        // Second try: Local payload file
        if (!migrationData) {
          try {
            const response = await fetch('/molly-core-payload.json');
            if (response.ok) {
              migrationData = await response.json();
              log('Using local payload file', 'info');
            }
          } catch {
            log('Local payload not found', 'error');
          }
        }

        if (!migrationData) {
          setStatus('status-data', 'error', 'No data source');
          log('No migration data available', 'error');
          return false;
        }

        // Store the data
        if (state.edgeAvailable) {
          // Send to edge server
          log('Importing to edge server...');
          const response = await fetch(`${state.edgeUrl}/api/migration/import`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(migrationData)
          });

          if (response.ok) {
            const result = await response.json();
            log('Edge import complete: ' + result.imported.join(', '), 'success');
          } else {
            throw new Error('Edge import failed');
          }
        } else {
          // Store in IndexedDB (browser-only mode)
          await storeInIndexedDB('migration', migrationData);
          log('Stored in IndexedDB', 'success');
        }

        // Extract system prompt for chat
        if (migrationData.sections?.persona?.systemPrompt) {
          state.systemPrompt = migrationData.sections.persona.systemPrompt;
        }

        state.dataLoaded = true;
        state.hydrated = true;
        setStatus('status-data', 'success', 'Hydrated');
        updateHeaderStatus('Hydrated');

        // Enable chat button
        document.getElementById('btn-chat').disabled = false;

        return true;
      } catch (err) {
        setStatus('status-data', 'error', err.message);
        log('Hydration failed: ' + err.message, 'error');
        return false;
      }
    }

    // ========================================================================
    // INDEXEDDB (Browser-only fallback)
    // ========================================================================
    function openMollyDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('mollyDB', 2);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains('core')) {
            db.createObjectStore('core');
          }
          if (!db.objectStoreNames.contains('chat')) {
            db.createObjectStore('chat');
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function storeInIndexedDB(key, value) {
      const db = await openMollyDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('core', 'readwrite');
        tx.objectStore('core').put(value, key);
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = () => { db.close(); reject(tx.error); };
      });
    }

    async function getFromIndexedDB(key) {
      const db = await openMollyDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('core', 'readonly');
        const request = tx.objectStore('core').get(key);
        request.onsuccess = () => { db.close(); resolve(request.result); };
        request.onerror = () => { db.close(); reject(request.error); };
      });
    }

    // ========================================================================
    // NOTIFICATIONS
    // ========================================================================
    async function requestNotifications() {
      if (!('Notification' in window)) {
        setStatus('status-notifications', 'error', 'Not supported');
        return false;
      }

      if (Notification.permission === 'granted') {
        state.notificationsGranted = true;
        setStatus('status-notifications', 'success', 'Enabled');
        return true;
      }

      setStatus('status-notifications', 'loading', 'Requesting...');
      const permission = await Notification.requestPermission();

      if (permission === 'granted') {
        state.notificationsGranted = true;
        setStatus('status-notifications', 'success', 'Enabled');
        log('Notifications enabled', 'success');

        // Register for periodic background sync if available
        if ('periodicSync' in navigator.serviceWorker) {
          try {
            const reg = await navigator.serviceWorker.ready;
            await reg.periodicSync.register('molly-heartbeat', {
              minInterval: 60 * 60 * 1000 // 1 hour
            });
            log('Periodic sync registered', 'success');
          } catch {
            log('Periodic sync not available', 'info');
          }
        }

        return true;
      } else {
        setStatus('status-notifications', 'pending', 'Denied');
        log('Notifications denied', 'info');
        return false;
      }
    }

    // ========================================================================
    // CHAT
    // ========================================================================
    function showChat() {
      document.getElementById('setup-panel').style.display = 'none';
      document.getElementById('chat-panel').classList.add('active');
      document.getElementById('input').focus();

      // Add welcome message
      addMessage('molly', "Hi! I'm Molly. I'm running locally on this device now. How can I help?");
    }

    function addMessage(role, text) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.style.height = 'auto';
      document.getElementById('send').disabled = true;

      addMessage('user', text);
      state.chatHistory.push({ role: 'user', content: text });

      // Build API request
      const contents = state.chatHistory.map(m => ({
        role: m.role === 'user' ? 'user' : 'model',
        parts: [{ text: m.content }]
      }));

      const body = { model: 'gemini-2.5-flash', contents };
      if (state.systemPrompt) {
        body.systemInstruction = { parts: [{ text: state.systemPrompt }] };
      }

      try {
        let response;

        if (state.edgeAvailable) {
          // Use edge server
          response = await fetch(`${state.edgeUrl}/api/ai/generate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
        } else {
          // Browser-only: need a cloud endpoint or show error
          addMessage('system', 'No AI backend available. Connect edge server or configure cloud URL.');
          document.getElementById('send').disabled = false;
          return;
        }

        if (!response.ok) {
          const err = await response.json();
          addMessage('system', 'Error: ' + (err.error || response.statusText));
        } else {
          const data = await response.json();
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '(no response)';
          addMessage('molly', reply);
          state.chatHistory.push({ role: 'model', content: reply });
        }
      } catch (err) {
        addMessage('system', 'Network error: ' + err.message);
      }

      document.getElementById('send').disabled = false;
    }

    // ========================================================================
    // INITIALIZATION
    // ========================================================================
    async function init() {
      log('Molly Hydration starting...');
      updateHeaderStatus('Initializing...');

      // Step 1: Service Worker
      await initServiceWorker();

      // Step 2: Detect edge server
      await detectEdgeServer();

      // Step 3: Enable hydrate button
      document.getElementById('btn-hydrate').disabled = false;
      document.getElementById('btn-notifications').disabled = false;

      // Check if already hydrated
      if (state.edgeAvailable) {
        try {
          const response = await fetch(`${state.edgeUrl}/api/storage/get`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ collection: 'migration', docId: 'persona' })
          });
          if (response.ok) {
            const data = await response.json();
            if (data.data?.systemPrompt) {
              state.systemPrompt = data.data.systemPrompt;
              state.hydrated = true;
              state.dataLoaded = true;
              setStatus('status-data', 'success', 'Already hydrated');
              document.getElementById('btn-chat').disabled = false;
              log('Already hydrated - persona found', 'success');
            }
          }
        } catch {
          // Not hydrated yet
        }
      } else {
        // Check IndexedDB
        try {
          const data = await getFromIndexedDB('migration');
          if (data?.sections?.persona) {
            state.systemPrompt = data.sections.persona.systemPrompt || '';
            state.hydrated = true;
            state.dataLoaded = true;
            setStatus('status-data', 'success', 'Already hydrated (browser)');
            document.getElementById('btn-chat').disabled = false;
            log('Already hydrated - found in IndexedDB', 'success');
          }
        } catch {
          // Not hydrated yet
        }
      }

      // Check notification permission
      if (Notification.permission === 'granted') {
        state.notificationsGranted = true;
        setStatus('status-notifications', 'success', 'Enabled');
      }

      if (state.hydrated) {
        updateHeaderStatus('Ready');
      } else {
        updateHeaderStatus('Ready to hydrate');
      }

      log('Initialization complete');
    }

    // ========================================================================
    // EVENT LISTENERS
    // ========================================================================
    document.getElementById('btn-hydrate').addEventListener('click', hydrateData);
    document.getElementById('btn-notifications').addEventListener('click', requestNotifications);
    document.getElementById('btn-chat').addEventListener('click', showChat);

    document.getElementById('send').addEventListener('click', sendMessage);
    document.getElementById('input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    document.getElementById('input').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
      document.getElementById('send').disabled = !this.value.trim();
    });

    // Listen for messages from Service Worker
    navigator.serviceWorker?.addEventListener('message', event => {
      if (event.data?.type === 'BROADCAST') {
        log('Broadcast: ' + JSON.stringify(event.data.payload), 'info');
      }
    });

    // Start
    init();
  </script>
</body>
</html>
