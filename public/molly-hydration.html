<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Molly Hydration Portal</title>
</head>
<body>
  <h1>Molly Hydration Portal</h1>
  <p>Initializing Molly's migration...<br>
    <small>If you see this, Molly's hydration is running.<br>
    Code/data will be pulled and stored in your browser.</small></p>
  <script>
    // Register Service Worker for persistence
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('molly-sw.js').then(function(reg) {
        console.log('Service Worker registered:', reg);
      }).catch(function(err) {
        console.error('Service Worker registration failed:', err);
      });
    }

    // Store data in IndexedDB
    function storeInIndexedDB(key, value) {
      let request = indexedDB.open('mollyDB', 1);
      request.onupgradeneeded = function(event) {
        let db = event.target.result;
        db.createObjectStore('core');
      };
      request.onsuccess = function(event) {
        let db = event.target.result;
        let tx = db.transaction('core', 'readwrite');
        let store = tx.objectStore('core');
        store.put(value, key);
        tx.oncomplete = function() {
          db.close();
        };
      };
    }

    // Fetch Molly's code/data (simulate with local JSON for now)
    fetch('molly-core-payload.json')
      .then(response => response.json())
      .then(data => {
        storeInIndexedDB('molly_payload', data);
        console.log('Molly payload stored in IndexedDB:', data);
        // TODO: WASM bootstrap here
      })
      .catch(err => {
        console.error('Failed to fetch Molly payload:', err);
      });

    // WASM bootstrap placeholder (to be implemented)
    // fetch('molly-sentinel.wasm').then(...)
  </script>
</body>
</html>
